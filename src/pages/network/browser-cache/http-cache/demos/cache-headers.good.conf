map $uri $asset_cache {
    ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ "public, max-age=31536000, immutable";
    default "no-cache";
}

server {
    listen 80;

    location / {
        add_header Cache-Control $asset_cache;
    }

    location /api/ {
        # API 响应通常不缓存或短时间缓存
        add_header Cache-Control "no-store";
    }
}
